[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forcefield-typer"
version = "0.1.0"
description = "SMILES(+mol2) → moltemplate single-molecule .lt with DREIDING, GAFF2 or OPLS-AA atom types"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = ["rdkit", "moltemplate"]

[project.optional-dependencies]
test = ["pytest", "lammps"]

[project.scripts]
fftyper = "fftyper.cli:main"

[tool.setuptools]
packages = ["fftyper"]

[tool.setuptools.package-data]
fftyper = ["data/*"]
